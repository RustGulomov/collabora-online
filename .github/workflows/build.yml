name: build dev
on:
  workflow_dispatch:
    inputs:
      libs_version:
        description: 'Версия библиотек платформы. Этот компонент её не использует, параметр принимается ради единого контракта сборки.'
        required: false
        default: ''
jobs:

  build_app:
    runs-on: ubuntu-22.04
    outputs:
      image_tag: ${{ steps.gen_tags.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: set global env
        id: global_env
        run: |
          echo "::set-output name=DOCKERHUB_IMAGE_NAME::registry.vaulterix.ru/dev/collabora"

      - name: Generate tags
        id: gen_tags
        run: |
          echo ::set-output name=tag::$(echo ${GITHUB_REF:10})
          echo "source_tag=sha-${GITHUB_SHA:0:7}" >> $GITHUB_OUTPUT

      - name: Build and tag image
        run: |
          # Контекст сборки — каталог самого Dockerfile, а не корень репозитория.
          # COPY / $BUILDDIR/ переносит в образ ровно build.sh и стартовый скрипт,
          # а исходники Collabora build.sh забирает сам. С корнем репозитория в
          # контексте COPY /start-collabora-online.sh не находит файла, и сборка
          # падает — так она не проходила здесь ни разу.
          docker build -f docker/from-source-gh-action/Dockerfile \
            --build-arg ONLINE_BRANCH="${{steps.gen_tags.outputs.tag}}" \
            -t "${{ steps.global_env.outputs.DOCKERHUB_IMAGE_NAME }}:${{steps.gen_tags.outputs.tag}}" \
            -t "${{ steps.global_env.outputs.DOCKERHUB_IMAGE_NAME }}:${{steps.gen_tags.outputs.source_tag}}" \
            docker/from-source-gh-action

      - name: Docker login
        run: docker login registry.vaulterix.ru -u ${{secrets.REGISTRY_USER}} -p ${{secrets.REGISTRY_PASSWORD}}

      - name: Publish image
        env:
          IMAGE_NAME: $GITHUB_REPOSITORY
        run: |
          docker push "${{ steps.global_env.outputs.DOCKERHUB_IMAGE_NAME }}:${{steps.gen_tags.outputs.tag}}"
          docker push "${{ steps.global_env.outputs.DOCKERHUB_IMAGE_NAME }}:${{steps.gen_tags.outputs.source_tag}}"
